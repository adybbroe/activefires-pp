name: test-environment
channels:
  - conda-forge
dependencies:
  # Runtime dependencies. Keep these in sync with project.dependencies in
  # pyproject.toml so CI can install the project with --no-deps.
  - cartopy
  - fiona
  - geojson
  - geopy
  - matplotlib
  - netifaces
  - numpy
  - pandas
  - pint
  - pycrs
  - pyproj
  - pytz
  - pyyaml
  - requests
  - shapely
  - six

  # Test and CI dependencies.
  - freezegun
  - geopandas
  - mock
  - pytest
  - pytest-cov
  - responses
  - coveralls
  - pip
  - pip:
    - trollsift
    - posttroll
